<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>胡思劇場・The Reverie</title>
<meta name="description" content="胡思樂園裡的一座選集式放映室。每一季都是一個獨立的世界，風格自由跳動。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Serif+TC:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />

<style>
  :root{
    --ground:#14101a; --ground-2:#0d0a12;
    --surface:#1e1826; --surface-2:#281f31; --line:#362b44;
    --ink:#f4ede1; --ink-dim:#ab9fb4; --ink-faint:#766a80;
    --gold:#e8b04b; --gold-soft:#f0c877; --rose:#d98aa6;
    --status-live:#f0a94b; --status-done:#8fb6a4; --status-single:#9d8fd0;
    --font-disp:"Marcellus","Noto Serif TC",serif;
    --font-serif:"Noto Serif TC","Songti TC",serif;
    --font-sans:"Noto Sans TC",system-ui,sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,monospace;
    --maxw:1180px; --read:39rem;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -8%, #241a30 0%, transparent 60%), var(--ground);
    color:var(--ink); font-family:var(--font-sans); line-height:1.6;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; min-height:100vh;
  }
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:3px}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(18px,4vw,40px)}

  /* 回園區（比照其他設施的固定返回鈕） */
  .backpark{
    position:fixed;top:14px;left:14px;z-index:80;
    font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;
    color:var(--ink-dim);background:rgba(13,10,18,.7);backdrop-filter:blur(6px);
    padding:7px 12px;border:1px solid var(--line);border-radius:99px;
    transition:color .2s,border-color .2s;
  }
  .backpark:hover{color:var(--gold-soft);border-color:var(--gold)}

  /* hero */
  .hero{padding:clamp(56px,9vw,86px) 0 24px;text-align:center}
  .hero .kicker{font-family:var(--font-disp);letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-size:.8rem;margin-bottom:18px}
  .hero h1{font-family:var(--font-serif);font-weight:900;font-size:clamp(2.6rem,7vw,4.4rem);line-height:1.02;margin:0;letter-spacing:.04em}
  .hero .en{display:block;font-family:var(--font-disp);font-size:clamp(.8rem,2.4vw,1rem);letter-spacing:.5em;color:var(--gold-soft);margin-top:16px;text-transform:uppercase}
  .hero .tag{margin:22px auto 0;max-width:36rem;color:var(--ink-dim);font-size:1.02rem;line-height:1.75}
  .hero .tag em{color:var(--gold-soft);font-style:normal}
  .rule{width:46px;height:2px;margin:26px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

  /* selector */
  .selector{position:sticky;top:0;z-index:30;
    background:linear-gradient(180deg,rgba(20,16,26,.97),rgba(20,16,26,.9));backdrop-filter:blur(8px);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0}
  .selrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sellabel{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin-right:2px;font-weight:500}
  .chip{font-family:var(--font-sans);font-size:.84rem;color:var(--ink-dim);background:var(--surface);border:1px solid var(--line);padding:6px 14px;border-radius:999px;cursor:pointer;transition:all .18s ease;line-height:1}
  .chip:hover{border-color:var(--ink-faint);color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#241704;font-weight:500}
  .chip.reset{color:var(--ink-faint);border-style:dashed}
  .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
  .count{margin-left:auto;font-size:.78rem;color:var(--ink-faint);font-variant-numeric:tabular-nums}

  /* wall */
  .wall{display:grid;gap:clamp(16px,2.4vw,26px);grid-template-columns:repeat(auto-fill,minmax(200px,1fr));padding:32px 0 80px}
  .poster{display:block;position:relative;border-radius:12px;overflow:hidden;aspect-ratio:2/3;cursor:pointer;isolation:isolate;border:1px solid var(--line);transition:transform .28s cubic-bezier(.2,.7,.3,1),box-shadow .28s}
  .poster:hover{transform:translateY(-6px);box-shadow:0 22px 44px -20px rgba(0,0,0,.8)}
  .poster .art{position:absolute;inset:0;z-index:-2}
  .poster .motif{position:absolute;z-index:-1;right:-.08em;bottom:-.14em;font-family:var(--font-serif);font-weight:900;font-size:12rem;line-height:.8;opacity:.16;color:#fff;pointer-events:none;text-shadow:0 4px 30px rgba(0,0,0,.4)}
  .poster .grain{position:absolute;inset:0;z-index:-1;opacity:.5;background-image:radial-gradient(rgba(255,255,255,.09) .5px,transparent .5px);background-size:3px 3px;mix-blend-mode:overlay}
  .poster .scrim{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(8,5,12,.05) 30%,rgba(8,5,12,.62) 72%,rgba(8,5,12,.92) 100%)}
  .poster .meta{position:absolute;z-index:1;inset:auto 0 0 0;padding:15px 15px 16px}
  .poster .stylet{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.72);font-weight:500;margin-bottom:7px}
  .poster h3{margin:0;font-family:var(--font-serif);font-weight:700;font-size:1.32rem;letter-spacing:.03em;line-height:1.14;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.5)}
  .poster .genres{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
  .gtag{font-size:.66rem;color:rgba(255,255,255,.82);background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.14);padding:2px 7px;border-radius:5px;backdrop-filter:blur(2px)}
  .badge{position:absolute;z-index:2;top:11px;left:11px;display:inline-flex;align-items:center;gap:6px;font-size:.68rem;font-weight:500;letter-spacing:.04em;padding:4px 9px;border-radius:6px;color:#120d08;background:rgba(255,255,255,.9)}
  .badge.live{background:var(--status-live)} .badge.done{background:var(--status-done)} .badge.single{background:var(--status-single)}
  .badge .dot{width:6px;height:6px;border-radius:50%;background:#120d08}
  .badge.live .dot{animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .progress-ribbon{position:absolute;z-index:2;top:11px;right:11px;font-size:.64rem;font-weight:500;color:var(--gold-soft);background:rgba(20,10,4,.72);border:1px solid rgba(232,176,75,.4);padding:3px 8px;border-radius:6px;backdrop-filter:blur(3px)}
  .empty{grid-column:1/-1;text-align:center;padding:70px 0;color:var(--ink-faint)}

  /* season */
  .season{padding:34px 0 90px}
  .back{display:inline-flex;align-items:center;gap:8px;margin-bottom:26px;font-size:.82rem;color:var(--ink-dim);letter-spacing:.04em}
  .back:hover{color:var(--gold-soft)}
  .back svg{width:15px;height:15px}
  .shead{display:grid;grid-template-columns:200px 1fr;gap:clamp(22px,4vw,44px);align-items:start}
  @media (max-width:640px){.shead{grid-template-columns:1fr}}
  .posterMini{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:2/3;border:1px solid var(--line);max-width:220px}
  .posterMini .motif{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-serif);font-weight:900;font-size:8rem;color:#fff;opacity:.18}
  .posterMini .grain2{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) .5px,transparent .5px);background-size:3px 3px;opacity:.5}
  .sinfo .eyebrow{font-family:var(--font-disp);letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-size:.74rem;margin-bottom:12px}
  .sinfo h2{margin:0;font-family:var(--font-serif);font-weight:900;font-size:clamp(2rem,5vw,3.1rem);letter-spacing:.04em;line-height:1.05}
  .sinfo .logline{margin:16px 0 0;color:var(--ink-dim);font-size:1.04rem;line-height:1.8;max-width:40rem;font-family:var(--font-serif)}
  .metaline{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:20px;font-size:.82rem;color:var(--ink-faint)}
  .metaline .statuschip{color:var(--ink);font-weight:500}
  .metaline .statuschip.live{color:var(--status-live)} .metaline .statuschip.done{color:var(--status-done)} .metaline .statuschip.single{color:var(--status-single)}
  .metaline .genres{display:flex;gap:6px;flex-wrap:wrap}
  .metaline .gtag2{color:var(--ink-dim);background:var(--surface);border:1px solid var(--line);padding:2px 9px;border-radius:5px;font-size:.72rem}
  .cta{margin-top:26px;display:inline-flex;align-items:center;gap:10px;font-family:var(--font-sans);font-weight:500;font-size:.95rem;letter-spacing:.03em;background:var(--gold);color:#231604;border:none;cursor:pointer;padding:13px 26px;border-radius:9px;transition:transform .16s,background .16s}
  .cta:hover{background:var(--gold-soft);transform:translateY(-1px)}
  .cta svg{width:16px;height:16px}
  .eplist{margin-top:48px;border-top:1px solid var(--line)}
  .eplist .lh{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);padding:20px 0 6px}
  .ep{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:16px;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:17px 8px;border-bottom:1px solid var(--line);color:var(--ink);font-family:var(--font-sans);transition:background .16s}
  .ep:hover{background:var(--surface)}
  .ep .no{font-family:var(--font-disp);font-size:1.15rem;color:var(--ink-faint);text-align:center;font-variant-numeric:tabular-nums}
  .ep.read .no{color:var(--gold)}
  .ep .body{min-width:0}
  .ep .t{font-size:1.02rem;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:9px}
  .ep .t .check{color:var(--gold);font-size:.8rem}
  .ep .syn{font-size:.82rem;color:var(--ink-faint);margin-top:3px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ep .rt{font-size:.78rem;color:var(--ink-faint);white-space:nowrap;font-variant-numeric:tabular-nums}
  .ep.locked{cursor:not-allowed;opacity:.5}
  .ep.locked:hover{background:none}
  .ep .lock{font-size:.74rem;color:var(--ink-faint);display:inline-flex;align-items:center;gap:5px}

  /* reader (script) */
  .reader{padding:30px 0 110px}
  .reader .rtop{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}
  .reader .rseason{font-size:.8rem;color:var(--ink-dim);letter-spacing:.04em}
  .reader .rseason:hover{color:var(--gold-soft)}
  .rcount{font-size:.76rem;color:var(--ink-faint);letter-spacing:.1em;font-variant-numeric:tabular-nums}
  .script{max-width:var(--read);margin:0 auto}
  .script .epno{font-family:var(--font-disp);letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-size:.78rem;text-align:center}
  .script > h1{font-family:var(--font-serif);font-weight:700;font-size:clamp(1.7rem,4.4vw,2.4rem);text-align:center;margin:14px 0 0;line-height:1.2;letter-spacing:.03em}
  .script .rt2{text-align:center;color:var(--ink-faint);font-size:.8rem;margin-top:13px}
  .script .headrule{width:40px;height:2px;background:var(--gold);margin:28px auto 30px;opacity:.7}
  .beatmark{display:flex;align-items:baseline;gap:12px;margin:2.6em 0 1.1em;padding-top:1.1em;border-top:1px solid var(--line)}
  .beatmark:first-of-type{margin-top:.4em;border-top:none;padding-top:0}
  .beatmark .tc{font-family:var(--font-mono);font-size:.82rem;color:var(--gold);letter-spacing:.02em;background:rgba(232,176,75,.1);border:1px solid rgba(232,176,75,.3);padding:2px 8px;border-radius:5px;white-space:nowrap}
  .beatmark .mlbl{font-size:.98rem;font-weight:500;color:var(--ink);letter-spacing:.02em}
  .beatmark .mlbl.only{color:var(--ink-dim)}
  .cardlabel{display:flex;align-items:center;gap:14px;margin:2em auto 1.4em;color:var(--gold-soft)}
  .cardlabel::before,.cardlabel::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
  .cardlabel span{font-family:var(--font-disp);letter-spacing:.22em;text-transform:uppercase;font-size:.82rem;white-space:nowrap}
  .titlecard{text-align:center;font-family:var(--font-serif);font-weight:900;font-size:clamp(1.5rem,4vw,2rem);letter-spacing:.05em;color:var(--ink);margin:1.2em auto;padding:.7em 1em;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .script .beat,.script .line,.script .cue{margin:0 0 .62em;font-size:1.06rem;line-height:1.72}
  .script .beat{color:#d9d0e0}
  .script .line{color:var(--ink)}
  .script .cue{color:var(--ink-faint);font-size:.92rem;margin-bottom:.15em;letter-spacing:.02em}
  .script strong{color:var(--gold-soft);font-weight:700;letter-spacing:.06em}
  .script del{color:var(--ink-faint)}
  .beatquote{margin:1.1em 0;padding:.4em 0 .4em 20px;border-left:2px solid var(--gold)}
  .beatquote p{margin:0 0 .4em;font-size:1.12rem;line-height:1.7;color:var(--gold-soft);font-weight:500}
  .beatquote p:last-child{margin-bottom:0}
  .beatquote strong{color:#fff}
  .script ul{margin:.4em 0 1em;padding-left:1.3em}
  .script li{margin:.2em 0;color:#d9d0e0;line-height:1.6}
  hr.scene{border:none;height:0;margin:1.7em auto;width:60px;border-top:1px dotted var(--ink-faint);opacity:.6}
  .rnav{max-width:var(--read);margin:52px auto 0;display:flex;gap:12px}
  .rnav a,.rnav span{flex:1;display:flex;flex-direction:column;gap:4px;padding:16px 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:border-color .16s,background .16s}
  .rnav a:hover{border-color:var(--gold);background:var(--surface-2)}
  .rnav .dir{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
  .rnav .nx{font-size:.92rem;color:var(--ink);font-weight:500}
  .rnav .next{text-align:right}
  .rnav .disabled{opacity:.4}
  .rnav .disabled .nx{color:var(--ink-faint)}
  .backtoseason{display:block;text-align:center;margin:26px auto 0;font-size:.82rem;color:var(--ink-dim)}
  .backtoseason:hover{color:var(--gold-soft)}

  .loading{padding:90px 0;text-align:center;color:var(--ink-faint);font-family:var(--font-mono);font-size:.85rem;letter-spacing:.08em}
  .loaderr{max-width:var(--read);margin:60px auto;text-align:center;color:var(--ink-dim);line-height:1.9}
  .loaderr code{font-family:var(--font-mono);font-size:.82rem;color:var(--gold-soft);background:var(--surface);padding:2px 6px;border-radius:5px}

  .sitefoot{border-top:1px solid var(--line);padding:26px 0}
  .sitefoot .frow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .sitefoot .note{font-size:.76rem;color:var(--ink-faint)}
  .sitefoot .en{font-family:var(--font-disp);letter-spacing:.22em;color:var(--ink-dim);font-size:.82rem;text-transform:uppercase}

  .view{animation:fade .34s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<a class="backpark" href="../../">← 回胡思樂園</a>

<main id="app"></main>

<footer class="sitefoot"><div class="wrap frow">
  <span class="note">胡思劇場 · 每一季皆為獨立單元 — 風格自由跳動，看完就走，偶爾回來</span>
  <span class="en">Not a channel. An anthology.</span>
</div></footer>

<script src="seasons.js"></script>
<script>
(function(){
  "use strict";
  const SEASONS_ = (typeof SEASONS !== "undefined" && Array.isArray(SEASONS)) ? SEASONS : [];

  const STATUS = { live:{label:"連載中",cls:"live"}, done:{label:"完結",cls:"done"}, single:{label:"單季完",cls:"single"} };
  const app = document.getElementById("app");
  const byId = id => SEASONS_.find(s=>s.id===id);
  const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
  const availCount = s => (s.episodes||[]).filter(e=>!e.locked).length;

  /* ---------- markdown loading (fetch each season's .md on demand) ---------- */
  const mdCache = {};      // season.id -> { epNo -> {title, body} }
  async function loadMd(s){
    if (mdCache[s.id]) return mdCache[s.id];
    const res = await fetch(s.md, { cache:"no-cache" });
    if (!res.ok) throw new Error("HTTP "+res.status);
    const map = splitEpisodes(await res.text());
    mdCache[s.id] = map;
    return map;
  }
  function splitEpisodes(raw){
    const lines = raw.replace(/\r/g,"").split("\n"); const map={}; let cur=null;
    for (const ln of lines){
      const m = ln.match(/^#\s+EP0*(\d+)｜(.+?)\s*$/);
      if (m){ const no=parseInt(m[1],10); let title=m[2].trim().replace(/^《/,"").replace(/》$/,""); cur={title,lines:[]}; map[no]=cur; }
      else if (cur){ cur.lines.push(ln); }
    }
    Object.values(map).forEach(e=>{ e.body=e.lines.join("\n"); delete e.lines; });
    return map;
  }
  const epTitle = (s,no) => { const md=mdCache[s.id]&&mdCache[s.id][no]; const meta=(s.episodes||[])[no-1]; return (md&&md.title) || (meta&&meta.t) || ("第 "+no+" 集"); };

  /* ---------- reading progress ---------- */
  const KEY="reverie.progress.v1";
  function loadProg(){ try { return JSON.parse(localStorage.getItem(KEY)||"{}"); } catch(e){ return {}; } }
  function saveProg(p){ try { localStorage.setItem(KEY, JSON.stringify(p)); } catch(e){} }
  function markRead(sid,no){ const p=loadProg(); if(!p[sid]) p[sid]={read:[],last:no}; if(!p[sid].read.includes(no)) p[sid].read.push(no); p[sid].last=no; saveProg(p); }
  function seasonProg(sid){ return loadProg()[sid]||null; }

  /* ---------- script renderer ---------- */
  function inlineFmt(s){ s=esc(s); s=s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>"); s=s.replace(/~~(.+?)~~/g,"<del>$1</del>"); return s; }
  function classify(line){ if(/：\s*$/.test(line)&&line.replace(/\s/g,"").length<=8&&!/[「」]/.test(line))return"cue"; if(/[「」“”]/.test(line))return"line"; return"beat"; }
  function beatmark(text){
    const parts=text.split("｜");
    if (parts.length>=2){ const tc=parts[0].trim(), lbl=parts.slice(1).join("｜").trim(); return `<div class="beatmark"><span class="tc">${esc(tc)}</span><span class="mlbl">${esc(lbl)}</span></div>`; }
    return `<div class="beatmark"><span class="mlbl only">${esc(text)}</span></div>`;
  }
  function renderScript(body){
    const lines=body.replace(/\r/g,"").split("\n"); const out=[]; let i=0;
    while (i<lines.length){
      let line=lines[i].replace(/\s+$/,"");
      if (line===""){ i++; continue; }
      if (line==="---"){ out.push('<hr class="scene">'); i++; continue; }
      const h=line.match(/^(#{1,6})\s+(.*)$/);
      if (h){ const lvl=h[1].length, txt=h[2].trim();
        if (lvl===1) out.push(`<div class="titlecard">${esc(txt.replace(/^《/,"").replace(/》$/,""))}</div>`);
        else if (lvl===2) out.push(beatmark(txt));
        else out.push(`<div class="cardlabel"><span>${inlineFmt(txt)}</span></div>`);
        i++; continue; }
      if (/^>\s?/.test(line)){
        const buf=[];
        while (i<lines.length && /^>/.test(lines[i].replace(/\s+$/,""))){ const t=lines[i].replace(/\s+$/,"").replace(/^>\s?/,""); if(t!=="")buf.push(t); i++; }
        out.push(`<blockquote class="beatquote">${buf.map(t=>`<p>${inlineFmt(t)}</p>`).join("")}</blockquote>`); continue;
      }
      if (/^[-*]\s+/.test(line)){
        const buf=[];
        while (i<lines.length && /^[-*]\s+/.test(lines[i].replace(/\s+$/,""))){ buf.push(lines[i].replace(/\s+$/,"").replace(/^[-*]\s+/,"")); i++; }
        out.push(`<ul>${buf.map(t=>`<li>${inlineFmt(t)}</li>`).join("")}</ul>`); continue;
      }
      out.push(`<p class="${classify(line)}">${inlineFmt(line)}</p>`); i++;
    }
    return out.join("\n");
  }

  /* ---------- filters ---------- */
  const filter={style:new Set(),genre:new Set(),status:new Set()};
  const ALL_STYLES=[...new Set(SEASONS_.map(s=>s.style))];
  const ALL_GENRES=[...new Set(SEASONS_.flatMap(s=>s.genres||[]))];
  const ALL_STATUS=[...new Set(SEASONS_.map(s=>s.status))];
  function anyFilter(){ return filter.style.size||filter.genre.size||filter.status.size; }
  function matches(s){
    if (filter.style.size && !filter.style.has(s.style)) return false;
    if (filter.status.size && !filter.status.has(s.status)) return false;
    if (filter.genre.size && !(s.genres||[]).some(g=>filter.genre.has(g))) return false;
    return true;
  }
  function posterArt(s){ const c=s.color||{a:"#222",b:"#333",accent:"#e8b04b"};
    return `<div class="art" style="background:
        radial-gradient(120% 80% at 78% 12%, ${c.accent}44 0%, transparent 46%),
        radial-gradient(90% 70% at 20% 96%, ${c.a} 0%, transparent 60%),
        linear-gradient(160deg, ${c.b} 0%, ${c.a} 100%);"></div>
      <div class="motif" style="color:${c.accent}">${esc(s.motif||"")}</div><div class="grain"></div>`;
  }

  /* ============ WALL ============ */
  function renderWall(){
    const chip=(g,v,l)=>`<button class="chip" role="button" aria-pressed="${filter[g].has(v)}" data-grp="${g}" data-val="${esc(v)}">${esc(l||v)}</button>`;
    const shown=SEASONS_.filter(matches);
    const filterRow = SEASONS_.length>1 ? `
      <div class="selector"><div class="wrap"><div class="selrow">
        <span class="sellabel">風格</span>${ALL_STYLES.map(v=>chip("style",v)).join("")}
        <span class="sep"></span><span class="sellabel">類型</span>${ALL_GENRES.map(v=>chip("genre",v)).join("")}
        <span class="sep"></span><span class="sellabel">狀態</span>${ALL_STATUS.map(v=>chip("status",v,STATUS[v].label)).join("")}
        ${anyFilter()?`<button class="chip reset" id="resetf">清除</button>`:``}
        <span class="count">${shown.length} / ${SEASONS_.length} 季</span>
      </div></div></div>` : ``;
    app.innerHTML=`
      <div class="view">
        <div class="wrap hero">
          <div class="kicker">Now Screening</div>
          <h1>胡思劇場<span class="en">The Reverie</span></h1>
          <p class="tag">胡思樂園裡的一座小戲院。每一季都是一個<em>獨立的世界</em>——日劇、韓劇、動畫、歐美影集，風格自由跳動，看完就走，偶爾回來。</p>
          <div class="rule"></div>
        </div>
        ${filterRow}
        <div class="wrap"><div class="wall">
          ${shown.length?shown.map(posterCard).join(""):`<div class="empty">這個組合下暫時沒有片子。<br/>換個標籤，或按「清除」看全部。</div>`}
        </div></div>
      </div>`;
    app.querySelectorAll(".chip[data-grp]").forEach(c=>c.addEventListener("click",()=>{ const g=c.dataset.grp,v=c.dataset.val; filter[g].has(v)?filter[g].delete(v):filter[g].add(v); renderWall(); }));
    const rf=document.getElementById("resetf"); if(rf) rf.addEventListener("click",()=>{filter.style.clear();filter.genre.clear();filter.status.clear();renderWall();});
    app.querySelectorAll(".poster").forEach(p=>p.addEventListener("click",()=>{location.hash="#/s/"+p.dataset.id;}));
    window.scrollTo({top:0});
  }
  function posterCard(s){
    const st=STATUS[s.status]||STATUS.done, prog=seasonProg(s.id);
    const ribbon=prog?`<div class="progress-ribbon">看到第 ${prog.last} 集</div>`:``;
    const total=(s.episodes||[]).length, avail=availCount(s);
    const epNote=s.status==="live"?`${avail}／${total} 集`:`全 ${total} 集`;
    return `<a class="poster" data-id="${s.id}" tabindex="0" role="button" aria-label="${esc(s.title)}">
      ${posterArt(s)}<div class="scrim"></div>
      <div class="badge ${st.cls}"><span class="dot"></span>${st.label}</div>${ribbon}
      <div class="meta"><div class="stylet">${esc(s.style)} · ${epNote}</div>
        <h3>${esc(s.title)}</h3>
        <div class="genres">${(s.genres||[]).map(g=>`<span class="gtag">${esc(g)}</span>`).join("")}</div>
      </div></a>`;
  }

  /* ============ SEASON ============ */
  async function renderSeason(id){
    const s=byId(id); if(!s){location.hash="#/";return;}
    app.innerHTML=`<div class="view"><div class="wrap"><div class="loading">載入《${esc(s.title)}》…</div></div></div>`;
    try { await loadMd(s); } catch(e){ return renderLoadError(s); }
    const st=STATUS[s.status]||STATUS.done, prog=seasonProg(s.id);
    const total=(s.episodes||[]).length, avail=availCount(s);
    const ctaNo=prog&&prog.last?prog.last:1;
    const ctaLabel=prog?`繼續看 · 第 ${prog.last} 集`:"從第一集開始看";
    app.innerHTML=`
      <div class="view"><div class="wrap season">
        <a class="back" href="#/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>回到片庫</a>
        <div class="shead">
          <div class="posterMini" style="background:linear-gradient(160deg, ${(s.color||{}).b}, ${(s.color||{}).a});">
            <div class="motif" style="color:${(s.color||{}).accent}">${esc(s.motif||"")}</div><div class="grain2"></div>
          </div>
          <div class="sinfo">
            <div class="eyebrow">${esc(s.style)} · Season 01</div>
            <h2>${esc(s.title)}</h2>
            <p class="logline">${esc(s.logline||"")}</p>
            <div class="metaline">
              <span class="statuschip ${st.cls}">● ${st.label}</span>
              <span>${s.status==="live"?`${avail}／${total} 集`:`全 ${total} 集`}</span>
              <span>約 ${s.runtime} 分／集</span>
              <span class="genres">${(s.genres||[]).map(g=>`<span class="gtag2">${esc(g)}</span>`).join("")}</span>
            </div>
            <button class="cta" id="playcta"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>${ctaLabel}</button>
          </div>
        </div>
        <div class="eplist"><div class="lh">分集 · Episodes</div>
          ${(s.episodes||[]).map((e,idx)=>epRow(s,idx+1,e,prog)).join("")}
        </div>
      </div></div>`;
    document.getElementById("playcta").addEventListener("click",()=>{location.hash=`#/s/${s.id}/e/${ctaNo}`;});
    app.querySelectorAll(".ep:not(.locked)").forEach(row=>row.addEventListener("click",()=>{location.hash=`#/s/${s.id}/e/${row.dataset.no}`;}));
    window.scrollTo({top:0});
  }
  function epRow(s,no,e,prog){
    const read=prog?prog.read.includes(no):false;
    const title=epTitle(s,no);
    if (e.locked){
      return `<div class="ep locked" aria-disabled="true"><div class="no">${no}</div>
        <div class="body"><div class="t">${esc(title)}</div><div class="syn">${esc(e.syn||"")}</div></div>
        <div class="lock">🔒 尚未放映</div></div>`;
    }
    return `<button class="ep ${read?"read":""}" data-no="${no}"><div class="no">${no}</div>
      <div class="body"><div class="t">${esc(title)} ${read?`<span class="check">✓ 已看</span>`:``}</div>
      <div class="syn">${esc(e.syn||"")}</div></div>
      <div class="rt">${s.runtime} 分</div></button>`;
  }

  /* ============ READER ============ */
  async function renderEpisode(sid,no){
    const s=byId(sid); if(!s){location.hash="#/";return;}
    app.innerHTML=`<div class="view"><div class="wrap"><div class="loading">載入第 ${no} 集…</div></div></div>`;
    let map; try { map=await loadMd(s); } catch(e){ return renderLoadError(s); }
    const meta=(s.episodes||[])[no-1], md=map[no];
    if (!meta || meta.locked || !md){ location.hash="#/s/"+sid; return; }
    markRead(sid,no);
    const total=(s.episodes||[]).length;
    const prevNo=no>1?no-1:null, nextNo=no<total?no+1:null;
    const navItem=(n,dir)=>{
      const label=dir==="prev"?"上一集":"下一集";
      const meta2=n?(s.episodes||[])[n-1]:null;
      const playable=n&&meta2&&!meta2.locked&&map[n];
      if (!playable){ const txt=!n?(dir==="prev"?"已是第一集":"已是最後一集"):"尚未放映"; return `<span class="${dir} disabled"><span class="dir">${label}</span><span class="nx">${txt}</span></span>`; }
      return `<a class="${dir}" href="#/s/${s.id}/e/${n}"><span class="dir">${label}</span><span class="nx">第 ${n} 集 · ${esc(epTitle(s,n))}</span></a>`;
    };
    app.innerHTML=`
      <div class="view"><div class="wrap reader">
        <div class="rtop"><a class="rseason" href="#/s/${s.id}">‹ ${esc(s.title)}</a>
          <span class="rcount">第 ${no} 集 · 共 ${total} 集</span></div>
        <div class="script">
          <div class="epno">Episode ${String(no).padStart(2,"0")}</div>
          <h1>${esc(md.title)}</h1>
          <div class="rt2">${esc(s.style)} · 約 ${s.runtime} 分鐘</div>
          <div class="headrule"></div>
          ${renderScript(md.body)}
        </div>
        <nav class="rnav">${navItem(prevNo,"prev")}${navItem(nextNo,"next")}</nav>
        <a class="backtoseason" href="#/s/${s.id}">回到本季分集表</a>
      </div></div>`;
    window.scrollTo({top:0});
  }

  function renderLoadError(s){
    app.innerHTML=`<div class="view"><div class="wrap"><div class="loaderr">
      <p>讀不到《${esc(s.title)}》的劇集檔（<code>${esc(s.md)}</code>）。</p>
      <p>如果你是在電腦上「直接打開 index.html」，瀏覽器會擋掉本機讀檔——這是正常的。<br/>
      用本機伺服器預覽（例如在 <code>works/theater/</code> 底下跑 <code>python -m http.server</code>），或直接部署到 Vercel 上就會正常。</p>
      <p><a class="back" href="#/">← 回片庫</a></p>
    </div></div></div>`;
    window.scrollTo({top:0});
  }

  /* ============ ROUTER ============ */
  function route(){
    const h=location.hash.replace(/^#\/?/,"");
    const parts=h.split("/").filter(Boolean);
    if (parts[0]==="s" && parts[1]){
      if (parts[2]==="e" && parts[3]) return renderEpisode(parts[1], parseInt(parts[3],10));
      return renderSeason(parts[1]);
    }
    renderWall();
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
