<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>認知貨幣・腦力結算單</title>
<meta name="description" content="把腦力想成一張悠遊卡，上班一路被嗶。24 題算出哪一種扣款對你最貴，還有這些腦力換回了多少。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* 爆米花黃配色：帳本概念保留在收據本身，外圍是園區 */
    --bg:#ffd23f;           /* 爆米花黃：背景 */
    --paper:#fbfbf6;        /* 收據紙 */
    --ink:#17171f;          /* 墨：主文字、按鈕 */
    --ink-soft:#474754;     /* 收據上的小字（對比 8.8） */
    --muted:#3d3410;        /* 黃底上的小字（對比 8.6） */
    --accent:#1a3fd9;       /* 售票藍：強調字（對比 5.3） */
    --popcorn:#ffd23f;      /* 深色元素上的黃字 */
    --box:rgba(255,255,255,.45);
    --ticket:#e8332a;       /* 票根紅：扣款、印章 */
    --ride:#0f8a6b;         /* 薄荷綠：換回 */
    --line:#d9d9cf;

    --display:'Huninn','Noto Sans TC',system-ui,sans-serif;
    --body:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
    --mono:'Space Mono','Noto Sans TC',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background-color:var(--bg);
    background-image:repeating-linear-gradient(115deg,
      rgba(255,255,255,.16) 0 38px, transparent 38px 76px);
    color:var(--ink);
    font-family:var(--body);
    line-height:1.65;
    min-height:100vh;
    overflow-x:hidden;
  }
  button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .wrap{max-width:640px;margin:0 auto;padding:clamp(20px,5vw,48px) 16px 96px}

  /* ---------- 共用按鈕 ---------- */
  .btn{
    font-family:var(--display);font-size:18px;letter-spacing:.06em;
    background:var(--ink);color:var(--popcorn);border:none;cursor:pointer;
    padding:15px 30px;border-radius:999px;
    box-shadow:0 5px 0 #000;transition:transform .1s ease,box-shadow .1s ease;
  }
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
  .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
  .btn.ghost:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.35;cursor:not-allowed;transform:none}

  /* ---------- 開場（一屏） ---------- */
  #intro{min-height:calc(100vh - 140px);display:flex;flex-direction:column;justify-content:center}
  .eyebrow{
    font-family:var(--mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;
    display:inline-flex;gap:10px;align-items:center;color:var(--accent);margin-bottom:18px
  }
  .eyebrow .chip{background:var(--ink);color:var(--popcorn);padding:2px 9px;border-radius:999px;letter-spacing:.12em}
  h1{
    font-family:var(--display);font-weight:400;
    font-size:clamp(34px,9vw,56px);line-height:1.15;letter-spacing:.01em;margin-bottom:22px
  }
  h1 em{font-style:normal;color:var(--accent)}
  .lede{font-size:17px;max-width:34em;margin-bottom:14px}
  .lede b{color:var(--accent);font-weight:700}
  .rules{
    margin:22px 0 30px;padding:14px 16px;border-radius:14px;
    background:var(--box);font-size:14px;color:var(--muted)
  }
  .rules li{list-style:none;padding-left:18px;position:relative}
  .rules li::before{content:'●';position:absolute;left:0;color:var(--accent);font-size:9px;top:6px}
  .startrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .meta{font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.06em}

  /* ---------- 進度 ---------- */
  .prog{
    position:sticky;top:0;z-index:30;display:none;
    background:var(--ink);color:var(--paper);border-radius:0 0 16px 16px;
    margin:calc(-1*clamp(20px,5vw,48px)) 0 6px;padding:12px 16px 14px;
    box-shadow:0 8px 20px rgba(0,0,0,.18)
  }
  .prog .top{display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--mono);font-size:12px;letter-spacing:.06em;margin-bottom:8px;gap:10px}
  .prog .dim{color:var(--popcorn);font-family:var(--body);font-weight:700;letter-spacing:.04em}
  .bar{height:8px;background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden}
  .bar span{display:block;height:100%;width:0;background:var(--popcorn);border-radius:999px;transition:width .35s ease}

  /* ---------- 題目卡 ---------- */
  #quiz{display:none}
  .qcard{
    background:var(--paper);color:var(--ink);border-radius:18px;
    padding:22px 18px 18px;margin-top:18px;
    box-shadow:0 10px 0 rgba(0,0,0,.14)
  }
  .qtag{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
  .qnum{font-family:var(--mono);font-weight:700;color:var(--ticket);font-size:14px}
  .dimname{font-weight:700;font-size:14px}
  .angle{font-size:12px;border:1.5px solid var(--ink);border-radius:999px;padding:0 8px;letter-spacing:.06em}
  .tagline{font-size:14px;color:var(--ink-soft);margin-bottom:12px}
  .qtext{font-size:18px;line-height:1.55;font-weight:500;margin-bottom:16px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    background:#fff;border:2px solid var(--line);border-radius:12px;
    padding:12px 13px;cursor:pointer;color:var(--ink);
    transition:border-color .15s ease,background .15s ease
  }
  .opt:hover{border-color:var(--ink)}
  .opt .k{
    font-family:var(--mono);font-weight:700;font-size:13px;flex:0 0 26px;height:26px;
    border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center
  }
  .opt .t{font-size:15px;line-height:1.5;padding-top:2px}
  .opt.sel{border-color:var(--ink);background:#fff6cc}
  .opt.sel .k{background:var(--ink);color:var(--popcorn)}
  .qnav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:12px}
  .linkbtn{background:none;border:none;cursor:pointer;color:var(--ink);font-size:15px;padding:8px 4px}
  .linkbtn[disabled]{opacity:.3;cursor:not-allowed}

  /* ---------- 結果：收據 ---------- */
  #results{display:none}
  .printer{
    height:26px;background:var(--ink);border-radius:12px 12px 6px 6px;position:relative;
    box-shadow:0 4px 0 rgba(0,0,0,.25);margin:12px 6px 0
  }
  .printer::after{content:'';position:absolute;left:14px;right:14px;bottom:6px;height:4px;background:#000;border-radius:2px}
  .receipt{
    background:var(--paper);color:var(--ink);margin:0 20px;position:relative;
    padding:22px 20px 34px;font-family:var(--mono);font-size:13px;
    box-shadow:0 12px 26px rgba(0,0,0,.2);
    /* 鋸齒撕邊 */
    -webkit-mask:
      conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 51% repeat-x,
      linear-gradient(#000 0 0) top/100% 51% no-repeat;
            mask:
      conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 51% repeat-x,
      linear-gradient(#000 0 0) top/100% 51% no-repeat;
  }
  .r-head{text-align:center;border-bottom:2px dashed var(--ink);padding-bottom:14px;margin-bottom:12px}
  .r-head .shop{font-family:var(--display);font-size:22px;letter-spacing:.08em}
  .r-head .sub{font-size:12px;color:var(--ink-soft);letter-spacing:.08em}
  .r-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:14px}
  .r-sec{font-size:12px;letter-spacing:.2em;color:var(--ink-soft);margin:14px 0 6px}
  .r-line{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:5px 0}
  .r-line .nm{font-family:var(--body);font-size:14px;font-weight:500}
  .r-line .dots{border-bottom:2px dotted #b9b9ae;transform:translateY(-3px)}
  .r-line .val{font-weight:700;font-size:14px;min-width:4.6em;text-align:right}
  .r-line.top .nm{color:var(--ticket)}
  .r-meter{grid-column:1/-1;display:flex;gap:3px;margin-top:2px}
  .r-meter i{flex:1;height:7px;border-radius:2px;background:#e7e7de}
  .r-meter i.on{background:var(--ink)}
  .r-line.top .r-meter i.on{background:var(--ticket)}
  .r-line.keep .r-meter i.on{background:var(--ride)}
  .r-total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);margin-top:10px;padding-top:9px}
  .r-total .nm{font-family:var(--body);font-weight:700;font-size:15px}
  .r-total .val{font-weight:700;font-size:18px}
  .r-quad{margin-top:18px;border:2px solid var(--ink);border-radius:10px;padding:12px;text-align:center}
  .r-quad .k{font-size:12px;letter-spacing:.2em;color:var(--ink-soft)}
  .r-quad .v{font-family:var(--display);font-size:24px;margin-top:2px}
  .r-radar{margin-top:16px;text-align:center;position:relative}
  .r-radar svg{width:100%;max-width:260px;height:auto}
  .r-foot{text-align:center;margin-top:16px;font-size:12px;color:var(--ink-soft)}
  .barcode{height:38px;margin:10px auto 6px;max-width:220px;
    background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 13px)}
  .stamp{
    position:absolute;right:-6px;top:-40px;transform:rotate(-12deg);mix-blend-mode:multiply;
    border:3px solid var(--ticket);color:var(--ticket);border-radius:10px;
    padding:8px 12px;text-align:center;background:transparent;
    font-family:var(--display);line-height:1.15;pointer-events:none;
    box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 4px var(--ticket)
  }
  .stamp small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.2em}
  .stamp b{display:block;font-weight:400;font-size:20px}
  .skip{display:block;margin:14px auto 0}

  /* ---------- 結果：白話解說 ---------- */
  #explain{margin-top:34px}
  .verdict{margin-bottom:18px}
  .verdict .k{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--accent)}
  .verdict h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,40px);line-height:1.2;margin:6px 0 10px}
  .verdict p{font-size:16px}
  .card{background:var(--box);border-radius:16px;padding:16px;margin-top:12px}
  .card h3{font-size:15px;font-weight:700;margin-bottom:8px;color:var(--accent)}
  .plain{display:grid;gap:10px}
  .plain .row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
  .plain .tag{font-family:var(--mono);font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--paper);color:var(--ink);white-space:nowrap;margin-top:3px}
  .plain .tag.hi{background:var(--ticket);color:#fff}
  .plain .tag.keep{background:var(--ride);color:#fff}
  .plain .row b{font-weight:700}
  .plain .row p{font-size:14px;line-height:1.6}
  .tension{background:var(--ink);color:var(--paper)}
  .tension h3{color:var(--popcorn)}
  .ask{font-size:15px;padding:8px 0 8px 12px;border-left:3px solid var(--accent);margin:8px 0}
  .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:26px}
  .toast{text-align:center;font-size:13px;min-height:1.6em;margin-top:10px;color:var(--ink);font-weight:700}
  .foot{margin-top:34px;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;line-height:1.8}

  @media (max-width:420px){
    .receipt{margin:0 10px;padding:20px 14px 32px}
    .printer{margin:12px 0 0}
    .stamp{right:-8px;top:-42px}
    .stamp b{font-size:17px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="prog" id="prog" data-flip-id="go">
    <div class="top"><span class="dim" id="pDim">注意力碎裂</span><span id="pNum">01 / 24</span></div>
    <div class="bar"><span id="pFill"></span></div>
  </div>

  <!-- ===== 開場 ===== -->
  <section id="intro">
    <div class="eyebrow"><span class="chip">v3</span>認知貨幣 · COGNITIVE CURRENCY</div>
    <h1>你的腦力，<br>今天被<em>扣了多少？</em></h1>
    <p class="lede">把腦力想成一張悠遊卡：早上加滿值，上班一路被嗶。</p>
    <p class="lede">有的扣款<b>換到東西</b>，像學會一個新技能，或做出一件拿得出手的作品。有的只是<b>被嗶掉</b>，像被打斷、猜主管在想什麼、追人回信、同一份東西改到第五版。</p>
    <p class="lede">這份測驗有 24 題，會算出哪一種扣款對你最貴，還有這些腦力換回了多少。</p>
    <ul class="rules">
      <li>以你最近一份工作、最近一個月的「平常狀態」作答，不挑最慘或最爽的那天。</li>
      <li>A 到 E 五個選項，猶豫就選 C。沒有標準答案。</li>
    </ul>
    <div class="startrow">
      <button class="btn" id="start" data-flip-id="go">開始結算</button>
      <span class="meta">24 題 · 約 5 分鐘 · 結果不上傳</span>
    </div>
  </section>

  <!-- ===== 作答 ===== -->
  <section id="quiz" aria-live="polite">
    <div id="qmount"></div>
    <div class="qnav">
      <button class="linkbtn" id="back" disabled>← 上一題</button>
      <button class="btn" id="next" disabled>下一題 →</button>
    </div>
  </section>

  <!-- ===== 結果 ===== -->
  <section id="results">
    <div class="printer" aria-hidden="true"></div>
    <div class="receipt" id="receipt"></div>
    <button class="btn ghost skip" id="skip">跳過列印</button>
    <div id="explain"></div>
  </section>

</div>

<!-- GSAP（3.13 起全外掛免費）。載入失敗時頁面照常運作，只是沒有動畫。 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/Flip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrambleTextPlugin.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/DrawSVGPlugin.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollToPlugin.min.js"></script>

<script>
/* =========================================================
   資料：六個維度
   前五個是「扣款」（高分＝這種消耗對你越貴）
   第六個是「換回」（高分＝付出有換到東西）
   ========================================================= */
const VERSION = 'v3';
const DIMS = {
  focus:   {name:'注意力碎裂', short:'碎裂', tagline:'量的不是工作量，是你的專注被切得多碎。'},
  judge:   {name:'模糊與判斷', short:'判斷', tagline:'沒有標準答案時，你是在思考，還是在猜。'},
  people:  {name:'協調與人際', short:'人際', tagline:'推進一件事之前，要先搬動多少人。'},
  power:   {name:'有責無權',   short:'權責', tagline:'你能不能決定自己要負責的事。'},
  rework:  {name:'重工蒸發',   short:'重工', tagline:'你做的東西留得下來，還是一直被推翻。'},
  redeem:  {name:'換回與殘值', short:'換回', tagline:'燒掉的腦力換回了什麼，下班後還剩多少自己。'}
};
const SPEND = ['focus','judge','people','power','rework'];

// 每題五個選項：A→E。扣款題 A=0（不貴）…E=4（很貴）。
// 換回題的分數寫在 score 欄位；"tension" 題不計入維度分數，只用來偵測張力。
const Q = [
  // ---- 注意力碎裂 ----
  {dim:'focus',angle:'當下',text:'專注做事時，半小時內被打斷三次，每個都說「先幫我看一下」。你：',
   opts:['切就切，馬上接得回來','有點煩，但很快回神','每次都要花點時間重新進入狀態','一天下來比做難事還累','光是「隨時會被打斷」就讓我整天專注不起來']},
  {dim:'focus',angle:'累積',text:'這份工作的常態，是同時掛著五六條線，永遠沒有一段完整不被碰的時間。長期你：',
   opts:['習慣就好，我本來就多工','偶爾希望清靜，但還行','會開始覺得每件事都只做了半套','長期下來覺得能力發揮不出來','持續一陣子我會明顯枯竭']},
  {dim:'focus',angle:'取捨',text:'兩份工作：一份錢多但整天被切碎，一份錢少一成但能大段專注。你傾向：',
   opts:['選錢多的，切碎沒差','偏錢多，但會猶豫','很難選，看當時狀況','偏專注那份，願意少拿一點','直接選專注，少一成我也換']},
  {dim:'focus',angle:'臨界',text:'到什麼程度，「被切碎」會讓你想離開一份其他都不錯的工作？',
   opts:['幾乎不會為這個走','要非常嚴重才會','會抱怨，但不至於走','持續很碎會讓我認真考慮走','光這一項就夠讓我想走']},

  // ---- 模糊與判斷 ----
  {dim:'judge',angle:'當下',text:'任務落到你手上，沒人說清楚你能決定到哪、界線在哪。你：',
   opts:['自己抓範圍做下去，享受這個空間','確認一下就繼續','會多問幾次才放心','一直卡在「這樣算不算越權」，綁手綁腳','搞不清界線就讓我對整件事失去動力']},
  {dim:'judge',angle:'判斷或猜測',text:'同樣是「沒有標準答案」，哪種更接近你的狀態？',
   opts:['我把它當成自己判斷的空間，反而來勁','大致還好，偶爾希望有人給個方向','一半一半，沒方向時會有點慌','要看是「我能決定」還是「我得猜別人要什麼」，後者很耗我','只要沒有明確標準，不管哪種我都很累']},
  {dim:'judge',angle:'取捨',text:'兩份工作：一份指令明確但你能決定的很少，一份很模糊但自由度大。你傾向：',
   opts:['選自由那份，模糊我不怕，還更喜歡','偏自由','很難選','偏明確，少決定沒關係','直接選明確，模糊讓我痛苦']},
  {dim:'judge',angle:'臨界',text:'「模糊、要靠猜」到什麼程度，你會想離開？',
   opts:['幾乎不會，我耐得住模糊','要很嚴重才會','會抱怨，但不至於走','長期理不清會成為我想走的理由','光這一項就夠讓我想走']},

  // ---- 協調與人際 ----
  {dim:'people',angle:'當下',text:'你的進度卡在別人身上，不追就不會來，追了又怕顯得煩。你：',

/* ---------- 計分（純函式，方便測試） ---------- */
function scoreOf(q, i){ return q.score ? q.score[i] : i; }
function compute(answers){
  const raw={focus:0,judge:0,people:0,power:0,rework:0,redeem:0};
  let growth=0;
  Q.forEach((q,n)=>{
    const s=scoreOf(q,answers[n]);
    if(q.tension) growth=s; else raw[q.dim]+=s;
  });
  const max={focus:16,judge:16,people:16,power:16,rework:16,redeem:12};
  const norm={}; Object.keys(raw).forEach(k=>norm[k]=raw[k]/max[k]);
  const spend=SPEND.reduce((s,k)=>s+norm[k],0)/SPEND.length;
  const redeem=norm.redeem;
  const order=[...SPEND].sort((a,b)=>norm[b]-norm[a]);
  const labelKey = norm[order[0]] < 0.35 ? 'calm' : order[0];
  const quad = spend>=0.5 ? (redeem>=0.5?'fight':'broke') : (redeem>=0.5?'cozy':'warm');
  const tension = redeem>=0.67 && growth>=3;
  return {raw,max,norm,spend,redeem,order,labelKey,quad,tension,growth};
}
function tier(v){ return v<0.35?0:(v<0.65?1:2); }

function render(animateIn=true){
  const q=Q[idx], d=DIMS[q.dim];
  $('#pDim').textContent=d.name;
  $('#pNum').textContent=String(idx+1).padStart(2,'0')+' / '+Q.length;
  $('#pFill').style.width=(idx/Q.length*100)+'%';

  mount.innerHTML=`

  const opts=mount.querySelector('.opts');
  q.opts.forEach((t,i)=>{
    const b=document.createElement('button');
    b.type='button';b.className='opt'+(answers[idx]===i?' sel':'');
    b.setAttribute('role','radio');b.setAttribute('aria-checked',answers[idx]===i);

    b.addEventListener('click',()=>choose(i,b));
    opts.appendChild(b);
  });

  nextBtn.disabled = answers[idx]===null;
  nextBtn.textContent = idx===Q.length-1 ? '列印結算單 →' : '下一題 →';

function choose(i,el){
  if(busy) return;
  answers[idx]=i;
  mount.querySelectorAll('.opt').forEach(o=>{o.classList.remove('sel');o.setAttribute('aria-checked','false')});
  el.classList.add('sel');el.setAttribute('aria-checked','true');
  nextBtn.disabled=false;
  if(animOn()){
    busy=true;
    gsap.timeline({onComplete:()=>{busy=false;advance();}})
      .fromTo(el,{scale:.97},{scale:1,duration:.18,ease:'back.out(3)'})
      .to({},{duration:.08});
  }
}

function go(step){
  const target=idx+step;
  if(target<0) return;
  if(target>=Q.length){ finish(); return; }
  if(animOn()){
    busy=true;
    gsap.to('.qcard',{x:step>0?-28:28,opacity:0,duration:.2,ease:'power1.in',onComplete:()=>{
      idx=target;render(false);
      gsap.from('.qcard',{x:step>0?28:-28,opacity:0,duration:.28,ease:'power2.out',onComplete:()=>busy=false});
    }});
  }else{ idx=target;render(false); }
  window.scrollTo(0,0);
}
function advance(){ if(answers[idx]!==null) go(1); }
nextBtn.addEventListener('click',()=>{ if(!busy) advance(); });
backBtn.addEventListener('click',()=>{ if(!busy) go(-1); });

let printTl=null;
function meterHTML(v,cells=10){
  const on=Math.round(v*cells);
  return Array.from({length:cells},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join('');
}
function radarSVG(norm){
  const cx=130,cy=118,R=86,n=SPEND.length;
  const ang=i=>(-90+i*360/n)*Math.PI/180;
  const pt=(i,r)=>[cx+Math.cos(ang(i))*R*r, cy+Math.sin(ang(i))*R*r];
  const ring=r=>SPEND.map((_,i)=>pt(i,r).map(v=>v.toFixed(1)).join(',')).join(' ');
  let axes='',labels='';
  SPEND.forEach((k,i)=>{
    const [x,y]=pt(i,1);
    axes+=`<line class="ax" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#c9c9bf" stroke-width="1.2"/>`;
    const [lx,ly]=pt(i,1.2);
    const anchor=Math.abs(lx-cx)<6?'middle':(lx<cx?'end':'start');
    labels+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="12" fill="#17171f" font-family="Noto Sans TC, sans-serif">${DIMS[k].short}</text>`;
  });
  const shape=SPEND.map((k,i)=>pt(i,Math.max(.05,norm[k])).map(v=>v.toFixed(1)).join(',')).join(' ');
  return `<svg viewBox="0 0 260 236" role="img" aria-label="五種扣款的形狀">
    <polygon class="ring" points="${ring(1)}" fill="none" stroke="#c9c9bf" stroke-width="1.2"/>
    <polygon class="ring" points="${ring(.5)}" fill="none" stroke="#e1e1d8" stroke-width="1"/>
    ${axes}
    <polygon id="shape" points="${shape}" data-final="${shape}" data-start="${ring(.5)}"
      fill="rgba(232,51,42,.2)" stroke="#e8332a" stroke-width="2.4" stroke-linejoin="round"/>
    ${labels}
  </svg>`;
}

    </div>
    <div class="toast" id="toast" role="status"></div>
    <div class="foot pl2">認知貨幣 ${VERSION} · 六維 24 題<br>原始分：碎裂 ${r.raw.focus} · 判斷 ${r.raw.judge} · 人際 ${r.raw.people} · 權責 ${r.raw.power} · 重工 ${r.raw.rework} · 換回 ${r.raw.redeem}/12<br>概念驗證原型，不是心理或職涯診斷。</div>`;

  $('#share').addEventListener('click',()=>share(label,quadName,top2));
  $('#again').addEventListener('click',restart);
  $('#skip').style.display='block';
  $('#skip').onclick=()=>{ if(printTl) printTl.progress(1); };

  window.scrollTo(0,0);
  if(animOn()) playPrint(); else $('#skip').style.display='none';
}

function askFor(k){
  return {
    focus:'一般的一天，我能有多少段不被打斷的時間？',
    judge:'這個職位的成功標準是誰定的？寫下來了嗎？',
    people:'我的產出有多少要靠其他部門先交件？',
    power:'我負責的事，哪些可以自己決定、哪些要等人簽？',
    rework:'過去半年，這個團隊做完又被推翻的事情多嗎？'
  }[k];
}

/* ---------- 列印動畫（約 7 秒） ---------- */
function playPrint(){
  const lines=gsap.utils.toArray('#receipt .pl');
  const after=gsap.utils.toArray('#explain .pl2');
  const vals=gsap.utils.toArray('#receipt .val');
  const shape=document.getElementById('shape');
  const stamp=document.getElementById('stamp');

  gsap.set(lines,{opacity:0,y:-10});
  gsap.set(after,{opacity:0,y:16});
  gsap.set(stamp,{opacity:0,scale:2.4});
  gsap.set('#receipt .r-meter i.on',{scaleX:0,transformOrigin:'left center'});

  // 使用者一碰螢幕就停止自動捲動
  let follow=true;
  const stop=()=>{follow=false;};
  ['wheel','touchstart','keydown'].forEach(e=>window.addEventListener(e,stop,{once:true,passive:true}));
  const followTo=el=>{
    if(!follow||!window.ScrollToPlugin) return;
    gsap.to(window,{duration:.5,ease:'power1.out',scrollTo:{y:el,offsetY:window.innerHeight*0.55,autoKill:true}});
  };

  printTl=gsap.timeline({onComplete:()=>{$('#skip').style.display='none';}});
  lines.forEach((el,i)=>{
    const at=i*0.42;
    printTl.to(el,{opacity:1,y:0,duration:.28,ease:'power2.out',onStart:()=>followTo(el)},at);
    const v=el.querySelector('.val');
    if(v && window.ScrambleTextPlugin){
      printTl.to(v,{duration:.5,scrambleText:{text:v.dataset.val,chars:'0123456789',speed:.6}},at);
    }
    const cells=el.querySelectorAll('.r-meter i.on');
    if(cells.length) printTl.to(cells,{scaleX:1,duration:.25,stagger:.03,ease:'power1.out'},at+.15);
  });
  // 雷達：軸線畫出，形狀從平均長成你的樣子
  const radarAt=lines.findIndex(el=>el.classList.contains('r-radar'))*0.42;
  if(window.DrawSVGPlugin){
    printTl.from('#receipt .ax, #receipt .ring',{drawSVG:0,duration:.5,stagger:.05},radarAt);
  }
  if(shape){
    const from=shape.dataset.start.split(' ').map(p=>p.split(',').map(Number));
    const to=shape.dataset.final.split(' ').map(p=>p.split(',').map(Number));
    const prox={t:0};
    shape.setAttribute('points',shape.dataset.start);
    printTl.to(prox,{t:1,duration:.9,ease:'elastic.out(1,.6)',onUpdate:()=>{
      shape.setAttribute('points',from.map((p,i)=>[p[0]+(to[i][0]-p[0])*prox.t,p[1]+(to[i][1]-p[1])*prox.t].map(v=>v.toFixed(1)).join(',')).join(' '));
    }},radarAt+.3);
  }
  // 蓋章
  printTl.to(stamp,{opacity:1,scale:1,duration:.32,ease:'back.out(2.2)',onStart:()=>followTo(document.getElementById('receipt'))},'+=0.25')
         .fromTo('#receipt',{x:-4},{x:0,duration:.3,ease:'elastic.out(1.2,.3)'},'<.22')
         .to(after,{opacity:1,y:0,duration:.4,stagger:.1,ease:'power2.out'},'+=0.2');
}

/* ---------- 分享與重測 ---------- */
async function share(label,quadName,top2){
  const url=location.href.split('#')[0].split('?')[0];
  const text=`我的認知貨幣結算單：${label}｜落在「${quadName}」。最貴的扣款是${DIMS[top2[0]].name}和${DIMS[top2[1]].name}。你的腦力被扣了多少？`;
  const toast=$('#toast');
  try{
    if(navigator.share){ await navigator.share({title:'認知貨幣結算單',text,url}); return; }
    await navigator.clipboard.writeText(text+' '+url);
    toast.textContent='已複製，貼給朋友吧';
  }catch(e){
    if(e && e.name==='AbortError') return;
    toast.textContent='複製失敗，請手動截圖分享';
  }
  setTimeout(()=>{toast.textContent='';},2400);
}
function restart(){
  if(printTl){printTl.kill();printTl=null;}
  if(hasGsap) gsap.killTweensOf(window);
  answers.fill(null);idx=0;
  results.style.display='none';
  $('#receipt').innerHTML='';$('#explain').innerHTML='';
  intro.style.display='flex';
  window.scrollTo(0,0);
}
</script>
