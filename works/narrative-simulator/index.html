<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>感情模擬器 — Personalized Narrative Simulator</title>
<style>
  :root{
    --bg:#0b0b10; --bg-panel:#14141d; --bg-panel-2:#1c1c28; --border:#2a2a3a;
    --text:#ecebf3; --text-dim:#9c9ab0; --accent:#ff5d5d; --accent-2:#6d8bff;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background: radial-gradient(circle at 20% -10%, #201b2e 0%, var(--bg) 55%);
    color:var(--text);
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    display:flex; justify-content:center; padding:40px 16px 90px;
  }
  #app{ width:100%; max-width:660px; }
  .brand{ text-align:center; margin-bottom:26px; }
  .brand .kicker{ font-size:12px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase; }
  .brand h1{
    font-size:clamp(22px,6vw,30px); letter-spacing:.5px; margin:6px 0 6px; line-height:1.2;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand p{ color:var(--text-dim); font-size:13px; margin:0; }

  .card{ background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); padding:26px 24px; margin-bottom:16px; }
  .fade-in{ animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .step-label{ font-size:12px; color:var(--text-dim); letter-spacing:1px; text-transform:uppercase; margin-bottom:10px; }
  .lead{ font-size:19px; font-weight:600; line-height:1.5; margin:0 0 18px; }
  .hint{ font-size:12.5px; color:var(--text-dim); margin:-10px 0 16px; }

  .qlist{ display:flex; flex-direction:column; gap:10px; }
  .qitem{
    text-align:left; width:100%; background:var(--bg-panel-2); border:1px solid var(--border);
    color:var(--text); border-radius:12px; padding:15px 16px; font-size:15.5px; cursor:pointer;
    font-family:inherit; transition:border-color .12s, transform .06s; line-height:1.4;
  }
  .qitem:hover{ border-color:var(--accent-2); }
  .qitem:active{ transform:scale(.99); }
  .qitem .arrow{ float:right; color:var(--text-dim); }

  label.field{ display:block; font-size:14.5px; font-weight:600; margin:18px 0 4px; }
  label.field .opt{ font-weight:400; color:var(--text-dim); font-size:12.5px; }
  .field-hint{ font-size:12px; color:var(--text-dim); margin:0 0 8px; }
  input[type=text], textarea{
    width:100%; background:var(--bg-panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:12px 14px; font-size:15px; font-family:inherit; outline:none; transition:border-color .15s;
  }
  input[type=text]:focus, textarea:focus{ border-color:var(--accent-2); }
  textarea{ min-height:80px; resize:vertical; }
  .charcount{ text-align:right; font-size:11px; color:var(--text-dim); margin-top:4px; }

  .options{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ padding:9px 15px; border-radius:999px; border:1px solid var(--border); background:var(--bg-panel-2);
    color:var(--text-dim); cursor:pointer; font-size:14px; transition:all .12s; user-select:none; }
  .chip:hover{ border-color:var(--accent-2); }
  .chip.selected{ background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#fff; border-color:transparent; }

  .nav-row{ display:flex; justify-content:space-between; align-items:center; margin-top:24px; gap:12px; }
  button{ font-family:inherit; font-size:14.5px; border-radius:10px; padding:11px 22px; border:none; cursor:pointer; transition:transform .08s, opacity .15s; }
  button:active{ transform:scale(.97); }
  .btn-primary{ background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#fff; font-weight:600; }
  .btn-primary:disabled{ opacity:.35; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--text-dim); border:1px solid var(--border); }
  .btn-ghost:hover{ color:var(--text); border-color:var(--text-dim); }

  .scene{ white-space:pre-wrap; line-height:1.95; font-size:15.5px; }
  .scene-q{ font-size:13px; color:var(--text-dim); border-left:2px solid var(--accent); padding-left:10px; margin-bottom:18px; }

  .react-title{ font-size:14px; font-weight:600; margin:24px 0 12px; }
  .react-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media(max-width:460px){ .react-grid{ grid-template-columns:1fr; } }
  .react-btn{ background:var(--bg-panel-2); border:1px solid var(--border); color:var(--text); border-radius:11px; padding:13px 14px; font-size:14.5px; cursor:pointer; text-align:left; transition:border-color .12s; }
  .react-btn:hover{ border-color:var(--accent-2); }
  .react-btn.picked{ border-color:var(--accent); background:rgba(255,93,93,.12); font-weight:600; }
  .react-btn.react-locked{ opacity:.32; }
  .react-btn:disabled{ cursor:default; }
  .react-btn:disabled:hover{ border-color:var(--border); }
  .react-btn.picked:disabled:hover{ border-color:var(--accent); }

  .reflect{ margin-top:16px; padding:14px 16px; border-radius:11px; background:var(--bg-panel-2); border:1px solid var(--border); font-size:14px; line-height:1.7; color:var(--text); }
  .reflect .tag{ display:block; font-size:11.5px; letter-spacing:1px; text-transform:uppercase; color:var(--text-dim); margin-bottom:6px; }

  .deepen-block{ margin-top:16px; padding-top:16px; border-top:1px dashed var(--border); }
  .deepen-block .scene{ font-size:15px; }

  .loading{ text-align:center; padding:44px 0; color:var(--text-dim); }
  .spinner{ width:34px; height:34px; margin:0 auto 16px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--accent); animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .error-box{ background:#2a1414; border:1px solid #5a2a2a; color:#ffb3b3; padding:12px 14px; border-radius:10px; font-size:13.5px; margin-bottom:14px; }

  .privacy-notice{ background:var(--bg-panel-2); border:1px solid var(--border); border-radius:11px; padding:12px 14px; font-size:12.5px; line-height:1.6; color:var(--text-dim); margin:0 0 18px; }
  .privacy-notice strong{ color:var(--text); font-weight:600; }

  footer{ text-align:center; color:var(--text-dim); font-size:11.5px; margin-top:24px; line-height:1.7; }

  .back-link{
    position:fixed; top:16px; left:16px; z-index:10;
    color:var(--text-dim); text-decoration:none; font-size:13px;
    padding:7px 12px; border-radius:999px; border:1px solid var(--border);
    background:rgba(20,20,29,.7); backdrop-filter:blur(6px); transition:color .15s, border-color .15s;
  }
  .back-link:hover{ color:var(--text); border-color:var(--text-dim); }
</style>
</head>
<body>
<a href="../../" class="back-link">← 回胡思樂園</a>
<div id="app"></div>

<script>
/* Personalized Narrative Simulator V2 — MVP cell
   感情 Love × Ordinary Life × Life Scene × 4 reaction buttons
   Frontend never sees the API key; it POSTs to /api/generate. */

const LOVE_QUESTIONS = [
  { key:'continue3y',     label:'如果跟現在這個人繼續三年？' },
  { key:'moveIn',         label:'如果我們同居／結婚？' },
  { key:'moreAttractive', label:'如果我遇到更有吸引力的人？' },
  { key:'moreIndependent',label:'如果對方開始更獨立？' },
  { key:'fearLosing',     label:'我真正害怕失去的是什麼？' },
];

const STATUS = [
  { key:'stable', label:'穩定交往中' },
  { key:'new', label:'剛在一起不久' },
  { key:'ambiguous', label:'曖昧或還沒確定' },
  { key:'singleThinking', label:'單身，但心裡有個人' },
  { key:'justEnded', label:'剛結束一段' },
];

const REACTIONS = [
  { key:'likeMe',   label:'這很像我',
    tag:'像我',
    reflect:'如果它很像你，那它裡面可能有一個你已經隱約知道、只是還沒對自己說出口的東西。它是哪一段？' },
  { key:'resist',   label:'我很抗拒這個版本',
    tag:'抗拒',
    reflect:'抗拒往往比認同更誠實。你抗拒的不一定是「它會發生」，而是它碰到了一個你不太想承認的可能。' },
  { key:'surprise', label:'我沒想到這件事',
    tag:'沒想到',
    reflect:'「沒想到」是這裡最有價值的訊號——它代表這一段繞過了你平常對自己講的那套說法，讓你看到一個原本不在畫面裡的東西。' },
  { key:'deeper',   label:'我想深入這條線',
    tag:'深入',
    reflect:null }, // triggers a deepen generation
];

let state = {
  screen:'question',   // question | context | loading | result | declined | error
  question:null,
  answers:{ status:'', dailyScene:'', quietThing:'', selfInRelationship:'', fear:'', hope:'' },
  sceneText:'',
  sceneToken:'',        // HMAC token bound to sceneText, required to call deepen
  reaction:null,       // single locked choice (once set, immutable)
  deepenText:'',
  loadingDeepen:false,
  declineMessage:'',
  error:'',
};

function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function esc(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(){
  const app=document.getElementById('app'); app.innerHTML='';
  app.appendChild(el(`
    <div class="brand">
      <div class="kicker">Personalized Narrative Simulator</div>
      <h1>感情模擬器</h1>
      <p>不是替你算結果，而是讓你先看一個可能的日常。</p>
    </div>`));
  if(state.screen==='question') app.appendChild(renderQuestion());
  if(state.screen==='context')  app.appendChild(renderContext());
  if(state.screen==='loading')  app.appendChild(renderLoading());
  if(state.screen==='result')   app.appendChild(renderResult());
  if(state.screen==='declined') app.appendChild(renderDeclined());
  if(state.screen==='error')    app.appendChild(renderError());
  app.appendChild(el(`<footer>這不是預言，只是其中一種看法。<br>Not a prediction. A perspective.</footer>`));
}

function renderQuestion(){
  const card=el(`<div class="card fade-in"></div>`);
  card.appendChild(el(`<div class="step-label">感情 · Choose a question</div>`));
  card.appendChild(el(`<div class="lead">你想看哪一件事？</div>`));
  card.appendChild(el(`<div class="hint">選一個你其實有點在意的問題。之後才會問你幾件事，好讓場景真的像你的。</div>`));
  const list=el(`<div class="qlist"></div>`);
  LOVE_QUESTIONS.forEach(q=>{
    const item=el(`<button class="qitem">${q.label}<span class="arrow">→</span></button>`);
    item.onclick=()=>{ state.question=q.key; state.screen='context'; render(); };
    list.appendChild(item);
  });
  card.appendChild(list);
  return card;
}

function renderContext(){
  const a=state.answers;
  const qlabel=(LOVE_QUESTIONS.find(q=>q.key===state.question)||{}).label||'';
  const card=el(`<div class="card fade-in"></div>`);
  card.appendChild(el(`<div class="step-label">Tell us enough to make it yours</div>`));
  card.appendChild(el(`<div class="lead">${esc(qlabel)}</div>`));
  card.appendChild(el(`<div class="hint">講得越具體，場景越可能「不合理地像你」。不用寫得漂亮，寫真的。</div>`));
  card.appendChild(el(`<div class="privacy-notice"><strong>送出前提醒：</strong>你填的內容會傳送給第三方 AI 服務（Anthropic）以生成場景，不會被本站保存。請避免填入真實姓名、聯絡方式等可辨識身份的個人資訊。</div>`));

  // status chips
  card.appendChild(el(`<label class="field">你現在的感情狀態？</label>`));
  const chips=el(`<div class="options"></div>`);
  STATUS.forEach(s=>{
    const c=el(`<div class="chip ${a.status===s.key?'selected':''}">${s.label}</div>`);
    c.onclick=()=>{ a.status=s.key; render(); };
    chips.appendChild(c);
  });
  card.appendChild(chips);

  // dailyScene
  card.appendChild(el(`<label class="field">你和這個人（或想像中的對象）相處的日常，會出現什麼畫面？</label>`));
  card.appendChild(el(`<div class="field-hint">例如：週末各自滑手機、一起追某部劇、他總是比你晚睡、你們最近常為了小事拌嘴。</div>`));
  card.appendChild(mkTextarea('dailyScene',300));

  // quietThing (optional)
  card.appendChild(el(`<label class="field">你們之間，有沒有一種你隱約感覺到、但還沒真的攤開講的東西？<span class="opt">（可跳過）</span></label>`));
  card.appendChild(mkTextarea('quietThing',300));

  // selfInRelationship
  card.appendChild(el(`<label class="field">在關係裡，你自己通常是什麼樣子？</label>`));
  card.appendChild(el(`<div class="field-hint">例如：容易先退一步／需要很多獨處空間／討厭衝突／嘴上說不在意其實會在意。</div>`));
  card.appendChild(mkTextarea('selfInRelationship',200));

  // fear (optional)
  card.appendChild(el(`<label class="field">你私下最怕這段關係，三年後變成什麼樣子？<span class="opt">（可跳過）</span></label>`));
  card.appendChild(mkTextarea('fear',200));

  // hope (optional) — balancing seed
  card.appendChild(el(`<label class="field">你最希望三年後，你們之間還留著什麼？<span class="opt">（可跳過）</span></label>`));
  card.appendChild(mkTextarea('hope',200));

  const nav=el(`<div class="nav-row"></div>`);
  const back=el(`<button class="btn-ghost">換個問題</button>`);
  back.onclick=()=>{ state.screen='question'; render(); };
  const go=el(`<button class="btn-primary">生成一個可能的日常 →</button>`);
  go.disabled=!contextValid();
  go.onclick=generateScene;
  nav.appendChild(back); nav.appendChild(go);
  card.appendChild(nav);
  return card;
}

function mkText(id,max){
  const a=state.answers;
  const wrap=el(`<div></div>`);
  const input=el(`<input type="text" maxlength="${max}" value="${esc(a[id]||'')}">`);
  input.oninput=()=>{ a[id]=input.value; count.textContent=`${input.value.length} / ${max}`; syncNav(); };
  const count=el(`<div class="charcount">${(a[id]||'').length} / ${max}</div>`);
  wrap.appendChild(input); wrap.appendChild(count); return wrap;
}
function mkTextarea(id,max){
  const a=state.answers;
  const wrap=el(`<div></div>`);
  const input=el(`<textarea maxlength="${max}">${esc(a[id]||'')}</textarea>`);
  input.oninput=()=>{ a[id]=input.value; count.textContent=`${input.value.length} / ${max}`; syncNav(); };
  const count=el(`<div class="charcount">${(a[id]||'').length} / ${max}</div>`);
  wrap.appendChild(input); wrap.appendChild(count); return wrap;
}
function contextValid(){
  const a=state.answers;
  return !!(a.status && a.dailyScene.trim() && a.selfInRelationship.trim());
}
function syncNav(){
  const go=document.querySelector('.nav-row .btn-primary');
  if(go) go.disabled=!contextValid();
}

function renderLoading(){
  return el(`<div class="card fade-in loading"><div class="spinner"></div><div>正在寫一個三年後的普通日子…</div></div>`);
}

function renderResult(){
  const qlabel=(LOVE_QUESTIONS.find(q=>q.key===state.question)||{}).label||'';
  const card=el(`<div class="card fade-in"></div>`);
  card.appendChild(el(`<div class="scene-q">${esc(qlabel)} ｜ Ordinary Life</div>`));
  card.appendChild(el(`<div class="scene">${esc(state.sceneText)}</div>`));

  // reactions — single choice, locks once picked
  const locked = state.reaction !== null;
  card.appendChild(el(`<div class="react-title">讀完之後，哪個反應最接近你現在的感覺？</div>`));
  if(!locked){
    card.appendChild(el(`<div class="hint" style="margin:-6px 0 12px;">只能選一個，選了就鎖定——所以選那個你身體最先有反應的。</div>`));
  }
  const grid=el(`<div class="react-grid"></div>`);
  REACTIONS.forEach(r=>{
    const isPicked = state.reaction===r.key;
    const cls = isPicked ? 'picked' : (locked ? 'react-locked' : '');
    const b=el(`<button class="react-btn ${cls}">${isPicked?'✓ ':''}${r.label}</button>`);
    if(!locked) b.onclick=()=>onReact(r.key);
    else b.disabled = true;
    grid.appendChild(b);
  });
  card.appendChild(grid);

  // reflection for the single picked non-deeper reaction
  const picked = REACTIONS.find(r=>r.key===state.reaction);
  if(picked && picked.reflect){
    card.appendChild(el(`<div class="reflect"><span class="tag">${picked.tag}</span>${esc(picked.reflect)}</div>`));
  }

  // deepen output / loading
  if(state.loadingDeepen){
    card.appendChild(el(`<div class="deepen-block loading"><div class="spinner"></div><div>把鏡頭推近那個瞬間…</div></div>`));
  } else if(state.deepenText){
    const d=el(`<div class="deepen-block"></div>`);
    d.appendChild(el(`<div class="step-label">深入這條線 · 把鏡頭推近</div>`));
    d.appendChild(el(`<div class="scene">${esc(state.deepenText)}</div>`));
    card.appendChild(d);
  }

  const nav=el(`<div class="nav-row"></div>`);
  const again=el(`<button class="btn-ghost">生成另一個版本</button>`);
  again.onclick=generateScene;
  const changeQ=el(`<button class="btn-ghost">換個問題</button>`);
  changeQ.onclick=()=>{ resetForNewQuestion(); state.screen='question'; render(); };
  nav.appendChild(again); nav.appendChild(changeQ);
  card.appendChild(nav);
  return card;
}

function renderDeclined(){
  const card=el(`<div class="card fade-in"></div>`);
  card.appendChild(el(`<div class="step-label">這一次，先停在這裡</div>`));
  card.appendChild(el(`<div class="scene" style="opacity:.95">${esc(state.declineMessage)}</div>`));
  const nav=el(`<div class="nav-row"></div>`);
  const back=el(`<button class="btn-ghost">回去改答案</button>`);
  back.onclick=()=>{ state.screen='context'; render(); };
  const changeQ=el(`<button class="btn-ghost">換個問題</button>`);
  changeQ.onclick=()=>{ resetForNewQuestion(); state.screen='question'; render(); };
  nav.appendChild(back); nav.appendChild(changeQ);
  card.appendChild(nav);
  return card;
}

function renderError(){
  const card=el(`<div class="card fade-in"></div>`);
  card.appendChild(el(`<div class="error-box">${esc(state.error)}</div>`));
  const nav=el(`<div class="nav-row"></div>`);
  const back=el(`<button class="btn-ghost">回去改答案</button>`);
  back.onclick=()=>{ state.screen='context'; render(); };
  const retry=el(`<button class="btn-primary">再試一次</button>`);
  retry.onclick=generateScene;
  nav.appendChild(back); nav.appendChild(retry);
  card.appendChild(nav);
  return card;
}

function resetForNewQuestion(){
  state.sceneText=''; state.sceneToken=''; state.reaction=null; state.deepenText=''; state.loadingDeepen=false;
}

function onReact(key){
  if(state.reaction!==null) return;   // locked — one choice only, no take-backs
  state.reaction=key;
  if(key==='deeper'){
    deepen();   // deepen() calls render()
    return;
  }
  render();
}

async function generateScene(){
  state.error=''; state.screen='loading';
  resetForNewQuestion();
  render();
  try{
    const res=await fetch('/api/generate',{
      method:'POST', headers:{'content-type':'application/json'},
      body:JSON.stringify({ mode:'scene', question:state.question, ...state.answers }),
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error||`伺服器錯誤 (${res.status})`);
    if(data.declined){ state.declineMessage=data.message||''; state.screen='declined'; render(); return; }
    state.sceneText=data.scene||'(沒有收到內容，請再試一次)';
    state.sceneToken=data.sceneToken||'';
    state.screen='result';
  }catch(err){
    state.error=err.message||String(err); state.screen='error';
  }
  render();
}

async function deepen(){
  state.loadingDeepen=true; render();
  try{
    const res=await fetch('/api/generate',{
      method:'POST', headers:{'content-type':'application/json'},
      body:JSON.stringify({ mode:'deepen', previousScene:state.sceneText, sceneToken:state.sceneToken }),
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error||`伺服器錯誤 (${res.status})`);
    state.deepenText = data.declined ? (data.message||'') : (data.scene||'（這次沒有生成出來。）');
  }catch(err){
    state.deepenText='';
    state.reaction=null;   // deepen failed — unlock so the choice can be made again
  }
  state.loadingDeepen=false; render();
}

render();
</script>

<!-- Vercel Web Analytics：不記名瀏覽量統計，給自己後台看 -->
<script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
