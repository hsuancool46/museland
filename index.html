<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Museland・胡思樂園</title>
<meta name="description" content="一座裝各種奇思妙想的遊樂園。設施不定期亂長，開幕沒有時刻表。" />

<!-- 全站色票 / 字體集中管理（未來要接品牌站，改這裡一處即可） -->
<style>
:root{
  /* 遊樂園「黃昏亮燈」基調 —— 全站殼的顏色，不是任何一項設施的裝潢 */
  --sky:        #1a1330;   /* 夜幕將暗、燈剛亮的天 */
  --sky-2:      #2a1f4d;   /* 天空漸層上緣 */
  --bulb:       #fff3dd;   /* 燈泡暖白 */
  --marquee:    #ffd23f;   /* 招牌燈金 */
  --pink:       #ff5c8a;   /* 旋轉木馬粉 */
  --teal:       #3ecfd0;   /* 摩天輪青 */
  --violet:     #8b7fd6;   /* 霓虹紫 */
  --ink:        #efe8ff;   /* 主要文字（亮） */
  --ink-dim:    #a99fce;   /* 次要文字 */
  --line:       rgba(255,255,255,.12);

  --display: "Baloo 2", "Noto Sans TC", system-ui, sans-serif;
  --body:    "Noto Sans TC", system-ui, -apple-system, sans-serif;
  --mono:    ui-monospace, "SF Mono", Menlo, monospace;

  --r: 18px;
  --maxw: 1400px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--body);
  color:var(--ink);
  background:
    radial-gradient(120% 80% at 50% -10%, var(--sky-2) 0%, var(--sky) 55%, #120d24 100%);
  min-height:100dvh;
  overflow-x:hidden;
  line-height:1.6;
}

/* ——— 夜空裡漂浮的燈點（氣氛，非內容） ——— */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.stars i{
  position:absolute;width:3px;height:3px;border-radius:50%;
  background:var(--bulb);opacity:.5;
  box-shadow:0 0 8px 1px var(--bulb);
  animation:twinkle 4s ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.7}}

.wrap{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:0 22px}

/* ================= 招牌 / HERO ================= */
header.marquee{padding:64px 0 26px;text-align:center}

/* 一圈跑馬燈燈泡框住招牌 */
.signboard{
  position:relative;display:inline-block;padding:34px 46px;border-radius:26px;
  background:linear-gradient(180deg, rgba(43,31,77,.65), rgba(26,19,48,.4));
  border:2px solid rgba(255,210,63,.35);
  box-shadow:0 0 0 6px rgba(26,19,48,.6), 0 20px 60px -20px rgba(0,0,0,.7),
             inset 0 0 40px rgba(255,210,63,.06);
}
/* 燈泡沿邊 */
.signboard::before{
  content:"";position:absolute;inset:9px;border-radius:18px;
  background-image:radial-gradient(circle, var(--marquee) 32%, transparent 34%);
  background-size:22px 22px;background-position:0 0;
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  padding:1px;-webkit-mask-composite:xor;mask-composite:exclude;
  opacity:.9;pointer-events:none;
  animation:chase 1.1s steps(2) infinite;
}
@keyframes chase{50%{opacity:.4}}

.eyebrow{
  font-family:var(--mono);font-size:12px;letter-spacing:.32em;
  color:var(--marquee);text-transform:uppercase;margin-bottom:12px;
}
h1{
  font-family:var(--display);font-weight:800;
  font-size:clamp(40px,9vw,76px);line-height:1;letter-spacing:.01em;
  color:var(--bulb);
  text-shadow:0 0 18px rgba(255,210,63,.35), 0 3px 0 rgba(0,0,0,.25);
}
h1 .en{
  display:block;font-size:clamp(15px,3.4vw,22px);letter-spacing:.5em;
  color:var(--teal);margin-top:12px;text-shadow:0 0 14px rgba(62,207,208,.4);
}
.tagline{
  max-width:34ch;margin:26px auto 0;color:var(--ink-dim);
  font-size:clamp(15px,2.6vw,17px);
}

/* ================= 園區地圖標題 ================= */
.mapbar{
  display:flex;align-items:center;gap:16px;margin:52px 0 22px;
}
.mapbar h2{
  font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink);
  white-space:nowrap;
}
.mapbar .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.mapbar .count{
  font-family:var(--mono);font-size:12px;color:var(--ink-dim);
  border:1px solid var(--line);border-radius:99px;padding:4px 11px;white-space:nowrap;
}

/* ================= 燈牆 / 設施格 ================= */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:20px;padding-bottom:20px;
}

.tile{
  position:relative;display:block;text-decoration:none;color:inherit;
  border-radius:var(--r);padding:26px 24px 24px;
  background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
  border:1px solid var(--line);
  overflow:hidden;isolation:isolate;
  transition:transform .28s cubic-bezier(.2,.8,.2,1), border-color .28s, box-shadow .28s;
}
/* 每項設施用自己的主題色發光 */
.tile::before{
  content:"";position:absolute;inset:0;z-index:-1;opacity:.0;
  background:radial-gradient(120% 90% at 20% -10%, var(--c) 0%, transparent 60%);
  transition:opacity .3s;
}
.tile:hover,.tile:focus-visible{
  transform:translateY(-6px);
  border-color:color-mix(in srgb, var(--c) 60%, transparent);
  box-shadow:0 22px 50px -24px var(--c), 0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent);
  outline:none;
}
.tile:hover::before,.tile:focus-visible::before{opacity:.16}
.tile:focus-visible{box-shadow:0 0 0 3px var(--sky),0 0 0 6px var(--c)}

/* 亮燈的小圓標 —— 這項設施的招牌燈 */
.bulb{
  width:38px;height:38px;border-radius:50%;margin-bottom:18px;
  background:radial-gradient(circle at 35% 30%, #fff, var(--c) 65%, color-mix(in srgb,var(--c) 40%,#000));
  box-shadow:0 0 20px 2px var(--c), inset 0 0 8px rgba(255,255,255,.6);
}
.tile h3{
  font-family:var(--display);font-weight:700;font-size:22px;color:var(--ink);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.tile .sub{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--ink-dim);margin-top:3px}
.tile p{color:var(--ink-dim);font-size:14.5px;margin-top:14px}
.tile .enter{
  font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--c);
  margin-top:18px;display:inline-flex;align-items:center;gap:6px;
}
.tile .enter .arrow{transition:transform .25s}
.tile:hover .enter .arrow,.tile:focus-visible .enter .arrow{transform:translateX(4px)}

/* 剛開幕燈牌 */
.newtag{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  color:#1a1330;background:var(--marquee);
  padding:3px 8px;border-radius:99px;font-weight:700;
  box-shadow:0 0 14px rgba(255,210,63,.6);
  animation:blink 1.6s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}

/* 外連小記號 */
.ext{font-size:11px;color:var(--ink-dim);opacity:.7}

/* 「還會開更多」的空位提示 */
.soon{
  border:1px dashed var(--line);border-radius:var(--r);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:34px 24px;color:var(--ink-dim);min-height:200px;
}
.soon .plus{font-size:30px;color:var(--violet);margin-bottom:10px}
.soon small{font-family:var(--mono);font-size:11px;letter-spacing:.1em}

/* ================= 頁尾 ================= */
footer{
  margin-top:56px;padding:34px 0 60px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;justify-content:space-between;
  color:var(--ink-dim);font-size:13px;
}
footer .who{max-width:46ch}
/* 預留：之後接品牌站的單向連結（現在隱藏佔位） */
footer .brand-link{font-family:var(--mono);font-size:12px;color:var(--ink-dim);text-decoration:none;opacity:.55;border-bottom:1px dotted var(--line)}
footer .brand-link:hover{opacity:1;color:var(--teal)}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important}
  .tile{transition:none}
}
</style>
</head>
<body>

<div class="stars" aria-hidden="true"></div>

<div class="wrap">

  <header class="marquee">
    <div class="signboard">
      <div class="eyebrow">Now Open · 全年無休</div>
      <h1>胡思樂園<span class="en">M U S E L A N D</span></h1>
    </div>
    <p class="tagline">歡迎光臨我腦內的遊樂園。這裡的設施都是我無聊時蓋的，主題各異，共通點只有「當時覺得很好玩」。</p>
  </header>

  <div class="mapbar">
    <h2>園區地圖</h2>
    <span class="rule"></span>
    <span class="count" id="count">— 項設施</span>
  </div>

  <main class="grid" id="grid" aria-label="園區設施列表"></main>

  <footer>
    <span class="who">胡思樂園 · 一個人的奇思妙想孵化場。設施不定期亂長，品質不保證，好玩優先。</span>
    <!-- 品牌接口佔位：日後由品牌站單向連進來，或這裡放一個回品牌站的隱性連結 -->
    <a class="brand-link" href="#" data-brand-placeholder>／ 關於蓋這座園的人 →</a>
  </footer>

</div>

<script src="works.js"></script>
<script>
(function(){
  // —— 夜空燈點 ——
  var sky = document.querySelector('.stars');
  var N = 34;
  for(var i=0;i<N;i++){
    var s=document.createElement('i');
    s.style.left=(Math.random()*100)+'%';
    s.style.top=(Math.random()*100)+'%';
    s.style.animationDelay=(Math.random()*4)+'s';
    s.style.transform='scale('+(0.6+Math.random()*1.4)+')';
    sky.appendChild(s);
  }

  // —— 由 WORKS 自動生成園區地圖 ——
  var grid = document.getElementById('grid');
  var frag = document.createDocumentFragment();

  (WORKS || []).forEach(function(w){
    var isExternal = !!w.external;
    var href = isExternal ? w.external : ('works/' + w.slug + '/');
    var a = document.createElement('a');
    a.className='tile';
    a.href=href;
    a.style.setProperty('--c', w.color || '#8b7fd6');
    if(isExternal){ a.target='_blank'; a.rel='noopener'; }

    a.innerHTML =
      '<span class="bulb" aria-hidden="true"></span>' +
      '<h3>'+ esc(w.title) +
        (w.isNew ? ' <span class="newtag">剛開幕</span>' : '') +
      '</h3>' +
      (w.subtitle ? '<div class="sub">'+ esc(w.subtitle) +'</div>' : '') +
      (w.blurb ? '<p>'+ esc(w.blurb) +'</p>' : '') +
      '<span class="enter">進場玩玩 <span class="arrow">→</span>' +
        (isExternal ? ' <span class="ext">(另開)</span>' : '') +
      '</span>';
    frag.appendChild(a);
  });

  // 「還會開更多」空位
  var soon=document.createElement('div');
  soon.className='soon';
  soon.innerHTML='<span class="plus">＋</span><span>下一項設施施工中</span><small>OPENING SOON</small>';
  frag.appendChild(soon);

  grid.appendChild(frag);
  document.getElementById('count').textContent = (WORKS||[]).length + ' 項設施';

  function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
})();
</script>
</body>
</html>
